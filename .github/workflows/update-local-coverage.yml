name: Update local NFL coverage

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh weekly regional coverage feed
        run: node scripts/update-local-coverage.mjs

      - name: Commit changed feed
        run: |
          if git diff --quiet -- local-coverage-2026.json; then
            echo "No coverage change"
            exit 0
          fi

          git config user.name "streamline-coverage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add local-coverage-2026.json
          git commit -m "Update weekly local NFL coverage"
          git push
