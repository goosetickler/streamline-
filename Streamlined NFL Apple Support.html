<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NFL Launcher" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>NFL Game Launcher</title>
  <style>
    :root{
      --bg:#070a12;
      --text:#f7f9ff;
      --muted:#aab4c8;
      --line:rgba(255,255,255,.12);
      --accent:#53b7ff;
      --green:#6affb7;
      --gold:#ffd166;
      --red:#ff365f;
      --shadow:0 14px 42px rgba(0,0,0,.36);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at 18% -8%,rgba(83,183,255,.20),transparent 34%),
        radial-gradient(circle at 90% 4%,rgba(106,255,183,.10),transparent 30%),
        linear-gradient(180deg,#070a12 0%,#0b101c 46%,#05070d 100%);
      padding:max(18px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom));
    }

    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.015),rgba(255,255,255,.015) 1px,transparent 1px,transparent 7px);
      opacity:.42;
    }

    button{font:inherit}
    .wrap{max-width:760px;margin:0 auto;position:relative}

    .app-header{
      position:sticky;
      top:0;
      z-index:10;
      padding:8px 0 14px;
      margin-bottom:4px;
      backdrop-filter:blur(18px);
      background:linear-gradient(180deg,rgba(7,10,18,.96),rgba(7,10,18,.80),transparent);
    }

    .title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .logo{
      width:42px;height:42px;flex:0 0 auto;border-radius:14px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),#315dff);
      box-shadow:0 10px 28px rgba(83,183,255,.26);
    }
    .logo svg{width:26px;height:26px}
    h1{margin:0;font-size:clamp(1.34rem,6.6vw,2.05rem);line-height:.95;letter-spacing:-.055em}
    .subtitle{margin:4px 0 0;color:var(--muted);font-size:.84rem;font-weight:650}
    .platform-badge{margin-top:5px;color:#94a3b8;font-size:.72rem;font-weight:800;letter-spacing:.02em}

    .refresh{
      flex:0 0 auto;
      border:1px solid var(--line);
      color:var(--text);
      background:rgba(255,255,255,.07);
      border-radius:14px;
      padding:9px 11px;
      font-weight:850;
      font-size:.86rem;
      cursor:pointer;
      min-height:44px;
    }
    .refresh:active{transform:scale(.98)}
    .refresh:focus,.watch:focus{outline:3px solid rgba(83,183,255,.45);outline-offset:2px}

    .week-bar{
      margin-top:12px;
      padding:11px 12px;
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.22);
    }
    .week-title{font-weight:1000;letter-spacing:-.02em;font-size:.98rem}
    .week-copy{color:var(--muted);font-size:.78rem;font-weight:750;text-align:right}
    .status{color:var(--muted);font-size:.86rem;line-height:1.35;margin:12px 0 10px}
    .status:empty{display:none}

    .day-group{margin:16px 0 22px}
    .day-heading{
      display:flex;align-items:center;gap:10px;
      margin:0 0 8px;
      color:var(--text);
      font-size:.82rem;
      font-weight:1000;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .day-heading:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}
    .games{display:grid;gap:10px}

    .game-card{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(155deg,rgba(21,31,51,.96),rgba(8,12,22,.98));
      box-shadow:var(--shadow);
      padding:12px;
    }
    .game-card:before{
      content:"";
      position:absolute;
      inset:-80px -80px auto auto;
      width:180px;height:180px;
      background:radial-gradient(circle,rgba(83,183,255,.15),transparent 62%);
      pointer-events:none;
    }

    .game-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
    .time{font-size:.78rem;color:var(--muted);font-weight:850;letter-spacing:.03em;text-transform:uppercase}
    .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .badge{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);padding:5px 8px;font-size:.66rem;line-height:1;letter-spacing:.05em;font-weight:1000;color:var(--muted)}
    .badge.network{background:var(--gold);border-color:transparent;color:#111827}
    .badge.live{background:var(--red);border-color:transparent;color:white;animation:pulse 1.15s ease-in-out infinite}
    @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,54,95,.13)}}

    .teams-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);
      align-items:center;
      gap:8px;
      margin:12px 0 9px;
      position:relative;
      z-index:1;
    }
    .team-row{display:flex;align-items:center;gap:7px;min-width:0}
    .team-row.home{justify-content:flex-end;text-align:right}
    .team-logo{width:28px;height:28px;object-fit:contain;object-position:center;flex:0 0 auto;filter:drop-shadow(0 4px 7px rgba(0,0,0,.25))}
    .team-logo.fallback{display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.09);color:var(--text);font-size:.67rem;font-weight:1000;border:1px solid var(--line);filter:none}
    .team-name{min-width:0;font-size:.92rem;line-height:1.05;font-weight:1000;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;font-style:italic}
    .vs{color:#c4cad7;font-size:.82rem;font-weight:1000;text-align:center;opacity:.92}

    .lower-row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
    .game-info{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:.78rem;font-weight:750}
    .game-info span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
    .watch{
      flex:0 0 auto;
      width:auto;
      min-width:106px;
      height:44px;
      border:0;
      border-radius:12px;
      padding:0 12px;
      color:#07111d;
      background:linear-gradient(135deg,var(--green),var(--accent));
      font-size:.75rem;
      font-weight:1000;
      letter-spacing:.035em;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
    }
    .watch svg{width:16px;height:16px}

    .empty{border:1px dashed var(--line);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.035)}
    .empty h2{margin:0 0 8px;color:var(--text)}
    .toast{position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:30;background:#111827;color:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow);transform:translateY(140%);transition:.22s ease;font-weight:750}.toast.show{transform:translateY(0)}

    @media (min-width:700px){
      body{padding-inline:24px}
      .games{grid-template-columns:repeat(2,minmax(0,1fr))}
      .week-copy{text-align:left}
      .team-name{font-size:.95rem}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div class="title-row">
        <div class="brand">
          <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12c4.4-7.2 11.6-7.2 16 0-4.4 7.2-11.6 7.2-16 0Z" stroke="white" stroke-width="2"/><path d="M9 12h6M12 9v6" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div>
            <h1>NFL Game Launcher</h1>
            <p class="subtitle">Weekly schedule + one-tap stream links</p>
            <div id="platformBadge" class="platform-badge">Detecting device...</div>
          </div>
        </div>
        <button id="refreshBtn" class="refresh" aria-label="Refresh NFL schedule">Refresh</button>
      </div>
      <section class="week-bar" aria-label="Current schedule view">
        <div><div class="week-title">Week Schedule</div><div id="weekRange" class="subtitle">Next available games</div></div>
        <div class="week-copy">Sorted by kickoff</div>
      </section>
    </header>

    <div id="scheduleStatus" class="status" role="status"></div>
    <main id="schedule" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const DEVICE = detectDevice();

    // ESPN scoreboard source. Community docs commonly reference this public endpoint pattern:
    // https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1000&dates=YYYY&seasontype=TYPE&week=WEEK
    const ESPN_BASE = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
    const MAX_GAMES_TO_SHOW = 18;
    const SCHEDULE_CACHE_KEY = "nflLauncher.schedule.v2";

    // Deep link notes:
    // - iOS custom URL schemes vary by provider and may change. Keep the web link as the reliable fallback.
    // - Android intent URLs include browser_fallback_url so unsupported/uninstalled apps can fall back to web.
    // - Replace app links with verified partner/affiliate links if you have them.
    const PROVIDER_LINKS = {
      prime: {
        label:"Prime Video",
        web:"https://www.primevideo.com/sports",
        ios:"aiv://",
        androidPackage:"com.amazon.avod.thirdpartyclient"
      },
      peacock: {
        label:"Peacock",
        web:"https://www.peacocktv.com/sports/nfl",
        ios:"peacocktv://",
        androidPackage:"com.peacocktv.peacockandroid"
      },
      espn: {
        label:"ESPN / ABC",
        web:"https://www.espn.com/watch/",
        ios:"espn://",
        androidPackage:"com.espn.score_center"
      },
      paramount: {
        label:"CBS / Paramount+",
        web:"https://www.paramountplus.com/sports/nfl/",
        ios:"paramountplus://",
        androidPackage:"com.cbs.ca"
      },
      fox: {
        label:"FOX",
        web:"https://www.foxsports.com/live",
        ios:"foxsports://",
        androidPackage:"com.foxsports.android"
      },
      nflnetwork: {
        label:"NFL Network",
        web:"https://www.nfl.com/network/",
        ios:"nfl://",
        androidPackage:"com.gotv.nflgamecenter.us.lite"
      },
      nflplus: {
        label:"NFL+",
        web:"https://www.nfl.com/plus/",
        ios:"nfl://",
        androidPackage:"com.gotv.nflgamecenter.us.lite"
      },
      youtubetv: {
        label:"YouTube TV",
        web:"https://tv.youtube.com/",
        ios:"youtubetv://",
        androidPackage:"com.google.android.apps.youtube.unplugged"
      }
    };

    const NETWORK_TO_PROVIDER = {
      "prime video":"prime", "prime":"prime", "amazon":"prime",
      "nbc":"peacock", "peacock":"peacock",
      "espn":"espn", "abc":"espn",
      "cbs":"paramount", "paramount":"paramount",
      "fox":"fox",
      "nfl network":"nflnetwork", "nfln":"nflnetwork",
      "youtube":"youtubetv"
    };

    const FALLBACK_SCHEDULE = [
      { id:"demo-1", dateTime:"2026-09-10T17:20:00-07:00", awayTeam:"Kansas City Chiefs", awayAbbr:"KC",  awayLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/kc.png",  homeTeam:"Denver Broncos",      homeAbbr:"DEN", homeLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/den.png", network:"Prime Video", status:"scheduled", venue:"Demo Stadium" },
      { id:"demo-2", dateTime:"2026-09-13T10:00:00-07:00", awayTeam:"Dallas Cowboys",      awayAbbr:"DAL", awayLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/dal.png", homeTeam:"Philadelphia Eagles", homeAbbr:"PHI", homeLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/phi.png", network:"FOX",         status:"scheduled", venue:"Demo Field" },
      { id:"demo-3", dateTime:"2026-09-13T13:25:00-07:00", awayTeam:"Buffalo Bills",       awayAbbr:"BUF", awayLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/buf.png", homeTeam:"Miami Dolphins",       homeAbbr:"MIA", homeLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/mia.png", network:"CBS",         status:"live",      venue:"Demo Stadium" },
      { id:"demo-4", dateTime:"2026-09-13T17:20:00-07:00", awayTeam:"San Francisco 49ers", awayAbbr:"SF",  awayLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/sf.png",  homeTeam:"Los Angeles Rams",     homeAbbr:"LAR", homeLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/lar.png", network:"NBC",         status:"scheduled", venue:"Demo Stadium" },
      { id:"demo-5", dateTime:"2026-09-14T17:15:00-07:00", awayTeam:"Baltimore Ravens",    awayAbbr:"BAL", awayLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/bal.png", homeTeam:"Cincinnati Bengals",   homeAbbr:"CIN", homeLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/cin.png", network:"ESPN / ABC",  status:"scheduled", venue:"Demo Field" },
      { id:"demo-6", dateTime:"2026-09-15T18:00:00-07:00", awayTeam:"Green Bay Packers",   awayAbbr:"GB",  awayLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/gb.png",  homeTeam:"Chicago Bears",        homeAbbr:"CHI", homeLogo:"https://a.espncdn.com/i/teamlogos/nfl/500/chi.png", network:"NFL Network", status:"scheduled", venue:"Demo Field" }
    ];

    let allGames = [];
    const scheduleEl = document.querySelector("#schedule");
    const statusEl = document.querySelector("#scheduleStatus");
    const weekRangeEl = document.querySelector("#weekRange");
    const toastEl = document.querySelector("#toast");
    const platformBadgeEl = document.querySelector("#platformBadge");

    function detectDevice(){
      const ua = navigator.userAgent || navigator.vendor || window.opera || "";
      const platform = navigator.platform || "";
      const isIPadOS = platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const isIOS = /iPad|iPhone|iPod/.test(ua) || isIPadOS;
      const isAndroid = /Android/i.test(ua);
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
      return { isIOS, isAndroid, isSafari, isStandalone, isMobile: isIOS || isAndroid };
    }

    function updatePlatformUi(){
      if(DEVICE.isIOS){
        platformBadgeEl.textContent = DEVICE.isStandalone ? "iPhone PWA" : "iPhone / iPad optimized";
        document.body.classList.add("ios");
      } else if(DEVICE.isAndroid){
        platformBadgeEl.textContent = "Android optimized";
        document.body.classList.add("android");
      } else {
        platformBadgeEl.textContent = "Mobile web optimized";
      }
    }

    function showToast(message){
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    function getSeasonYear(){
      const now = new Date();
      const year = now.getFullYear();
      return now.getMonth() <= 1 ? year - 1 : year;
    }

    function buildEspnUrls(){
      const season = getSeasonYear();
      const urls = [`${ESPN_BASE}?limit=1000&dates=${season}`];
      for(const type of [1,2,3]){
        const maxWeek = type === 2 ? 18 : 5;
        for(let week = 1; week <= maxWeek; week++){
          urls.push(`${ESPN_BASE}?limit=1000&dates=${season}&seasontype=${type}&week=${week}`);
        }
      }
      return urls;
    }

    async function fetchSchedule(){
      statusEl.textContent = "";
      try{
        allGames = await fetchEspnSchedule();
        if(!allGames.length) throw new Error("No ESPN games returned");
        cacheSchedule(allGames);
      }catch(err){
        const cached = readCachedSchedule();
        allGames = cached.length ? cached : normalizeFallback(FALLBACK_SCHEDULE);
      }
      renderSchedule();
    }

    async function fetchEspnSchedule(){
      const urls = buildEspnUrls();
      const seen = new Set();
      let games = [];

      const first = await fetchJson(urls[0]);
      games = normalizeEspn(first, seen);

      if(getDisplayGames(games).length < 6){
        const weekResults = await Promise.allSettled(urls.slice(1).map(fetchJson));
        for(const result of weekResults){
          if(result.status === "fulfilled") games.push(...normalizeEspn(result.value, seen));
        }
      }
      return games.sort((a,b) => new Date(a.dateTime) - new Date(b.dateTime));
    }

    async function fetchJson(url){
      const res = await fetch(url, { cache:"no-store" });
      if(!res.ok) throw new Error(`${res.status} ${url}`);
      return await res.json();
    }

    function normalizeEspn(raw, seen){
      const events = Array.isArray(raw?.events) ? raw.events : [];
      return events.map(event => {
        const competition = event.competitions?.[0] || {};
        const competitors = competition.competitors || [];
        const home = competitors.find(c => c.homeAway === "home") || {};
        const away = competitors.find(c => c.homeAway === "away") || {};
        const broadcast = competition.broadcasts?.[0]?.names?.[0] || competition.broadcasts?.[0]?.shortName || "TBD";
        const id = event.id || event.uid || `${away.team?.abbreviation}-${home.team?.abbreviation}-${event.date}`;
        if(seen.has(id)) return null;
        seen.add(id);
        return {
          id,
          dateTime: event.date || competition.date,
          homeTeam: home.team?.displayName || home.team?.name || "Home Team",
          awayTeam: away.team?.displayName || away.team?.name || "Away Team",
          homeAbbr: home.team?.abbreviation || "HOME",
          awayAbbr: away.team?.abbreviation || "AWAY",
          homeLogo: getLogo(home.team),
          awayLogo: getLogo(away.team),
          homeScore: home.score,
          awayScore: away.score,
          network: broadcast,
          status: (event.status?.type?.state || event.status?.type?.name || "scheduled").toLowerCase(),
          statusDetail: event.status?.type?.shortDetail || event.status?.type?.detail || "",
          venue: competition.venue?.fullName || ""
        };
      }).filter(g => g && g.dateTime && !Number.isNaN(new Date(g.dateTime).getTime()));
    }

    function getLogo(team){
      return team?.logos?.[0]?.href || team?.logo || team?.logos?.find?.(l => l.href)?.href || "";
    }

    function normalizeFallback(list){
      return list.map(g => ({...g, statusDetail:"", homeScore:"", awayScore:""}));
    }

    function cacheSchedule(games){
      try{
        localStorage.setItem(SCHEDULE_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), games }));
      }catch(err){}
    }

    function readCachedSchedule(){
      try{
        const cached = JSON.parse(localStorage.getItem(SCHEDULE_CACHE_KEY) || "null");
        return Array.isArray(cached?.games) ? cached.games : [];
      }catch(err){
        return [];
      }
    }

    function getDisplayGames(sourceGames = allGames){
      const now = new Date();
      const sorted = [...sourceGames].sort((a,b) => new Date(a.dateTime) - new Date(b.dateTime));
      const upcoming = sorted.filter(g => new Date(g.dateTime) >= new Date(now.getTime() - 4 * 60 * 60 * 1000));
      return (upcoming.length ? upcoming : sorted).slice(0, MAX_GAMES_TO_SHOW);
    }

    function groupByDay(games){
      return games.reduce((acc, game) => {
        const key = new Date(game.dateTime).toLocaleDateString([], { weekday:"long", month:"short", day:"numeric" });
        acc[key] ||= [];
        acc[key].push(game);
        return acc;
      }, {});
    }

    function renderSchedule(){
      const games = getDisplayGames();
      updateWeekRange(games);
      if(!games.length){
        scheduleEl.innerHTML = `<section class="empty"><h2>No games found</h2><p>Try Refresh or check the provider endpoint.</p></section>`;
        return;
      }
      const groups = groupByDay(games);
      scheduleEl.innerHTML = Object.entries(groups).map(([day, dayGames]) => `
        <section class="day-group" aria-labelledby="${slug(day)}">
          <h2 class="day-heading" id="${slug(day)}">${day}</h2>
          <div class="games">${dayGames.map(renderGameCard).join("")}</div>
        </section>
      `).join("");
    }

    function renderGameCard(game){
      const providerKey = providerFromNetwork(game.network);
      const provider = PROVIDER_LINKS[providerKey] || PROVIDER_LINKS.nflplus;
      const isLive = game.status.includes("in") || game.status.includes("live");
      const scoreText = hasScore(game) ? `${game.awayScore} - ${game.homeScore}` : escapeHtml(game.statusDetail || game.venue || "");
      return `
        <article class="game-card" aria-label="${escapeHtml(game.awayTeam)} at ${escapeHtml(game.homeTeam)}">
          <div class="game-top">
            <div class="time">${formatKickoff(game.dateTime)}</div>
            <div class="badges">
              <span class="badge network">${escapeHtml(game.network)}</span>
              ${isLive ? `<span class="badge live">LIVE</span>` : `<span class="badge">${escapeHtml(cleanStatus(game.status))}</span>`}
            </div>
          </div>

          <div class="teams-row">
            ${renderTeam(game.awayAbbr, game.awayTeam, game.awayLogo, "away")}
            <div class="vs">@</div>
            ${renderTeam(game.homeAbbr, game.homeTeam, game.homeLogo, "home")}
          </div>

          <div class="lower-row">
            <div class="game-info"><span>${scoreText}</span><span>•</span><span>${escapeHtml(provider.label)}</span></div>
            <button class="watch" aria-label="Open ${escapeHtml(provider.label)} for ${escapeHtml(game.awayAbbr)} at ${escapeHtml(game.homeAbbr)}" onclick='openProvider("${providerKey}", ${JSON.stringify(game).replace(/'/g,"&#39;")})'>${playIcon()} WATCH</button>
          </div>
        </article>`;
    }

    function renderTeam(abbr, name, logo, side){
      const shortName = teamShortName(name, abbr);
      const logoHtml = logo
        ? `<img class="team-logo" src="${escapeHtml(logo)}" alt="${escapeHtml(name)} logo" loading="lazy" decoding="async" onerror="this.replaceWith(makeFallbackLogo('${escapeJs(abbr)}'))">`
        : `<span class="team-logo fallback">${escapeHtml(abbr)}</span>`;
      if(side === "home"){
        return `<div class="team-row home"><span class="team-name">${escapeHtml(shortName)}</span>${logoHtml}</div>`;
      }
      return `<div class="team-row">${logoHtml}<span class="team-name">${escapeHtml(shortName)}</span></div>`;
    }

    function makeFallbackLogo(abbr){
      const span = document.createElement("span");
      span.className = "team-logo fallback";
      span.textContent = abbr || "NFL";
      return span;
    }

    function teamShortName(name, abbr){
      const map = {
        ARI:"Cardinals", ATL:"Falcons", BAL:"Ravens", BUF:"Bills", CAR:"Panthers", CHI:"Bears", CIN:"Bengals", CLE:"Browns",
        DAL:"Cowboys", DEN:"Broncos", DET:"Lions", GB:"Packers", HOU:"Texans", IND:"Colts", JAX:"Jaguars", KC:"Chiefs",
        LV:"Raiders", LAC:"Chargers", LAR:"Rams", MIA:"Dolphins", MIN:"Vikings", NE:"Patriots", NO:"Saints", NYG:"Giants",
        NYJ:"Jets", PHI:"Eagles", PIT:"Steelers", SEA:"Seahawks", SF:"49ers", TB:"Buccaneers", TEN:"Titans", WAS:"Commanders"
      };
      return map[abbr] || String(name || abbr).replace(/^(Arizona|Atlanta|Baltimore|Buffalo|Carolina|Chicago|Cincinnati|Cleveland|Dallas|Denver|Detroit|Green Bay|Houston|Indianapolis|Jacksonville|Kansas City|Las Vegas|Los Angeles|Miami|Minnesota|New England|New Orleans|New York|Philadelphia|Pittsburgh|San Francisco|Seattle|Tampa Bay|Tennessee|Washington)\s+/i, "");
    }

    function providerFromNetwork(network){
      const n = String(network || "").toLowerCase();
      const hit = Object.keys(NETWORK_TO_PROVIDER).find(key => n.includes(key));
      return hit ? NETWORK_TO_PROVIDER[hit] : "nflplus";
    }

    function openProvider(providerKey, game){
      const provider = PROVIDER_LINKS[providerKey] || PROVIDER_LINKS.nflplus;
      const webUrl = addTracking(provider.web, game.id);
      const targetUrl = getPlatformUrl(provider, webUrl);
      showToast(`Opening ${provider.label}`);

      if(DEVICE.isAndroid && targetUrl.startsWith("intent://")){
        window.location.href = targetUrl;
        return;
      }

      if(DEVICE.isIOS && provider.ios){
        const startedAt = Date.now();
        window.location.href = targetUrl;
        setTimeout(() => {
          if(Date.now() - startedAt < 1800 && !document.hidden){
            window.location.href = webUrl;
          }
        }, 900);
        return;
      }

      window.open(webUrl, "_blank", "noopener,noreferrer");
    }

    function getPlatformUrl(provider, webUrl){
      if(DEVICE.isAndroid && provider.androidPackage){
        const host = new URL(webUrl).host;
        const path = new URL(webUrl).pathname.replace(/^\//, "");
        return `intent://${host}/${path}#Intent;scheme=https;package=${provider.androidPackage};S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
      }
      if(DEVICE.isIOS && provider.ios){
        return provider.ios;
      }
      return webUrl;
    }

    function addTracking(url, gameId){
      const joiner = url.includes("?") ? "&" : "?";
      return `${url}${joiner}utm_source=nfl_game_launcher&game=${encodeURIComponent(gameId)}`;
    }

    function updateWeekRange(games){
      if(!games.length){ weekRangeEl.textContent = "No games available"; return; }
      const first = new Date(games[0].dateTime);
      const last = new Date(games[games.length - 1].dateTime);
      const opts = { month:"short", day:"numeric" };
      weekRangeEl.textContent = `${first.toLocaleDateString([], opts)} - ${last.toLocaleDateString([], opts)}`;
    }

    function formatKickoff(iso){ return new Date(iso).toLocaleString([], { weekday:"short", hour:"numeric", minute:"2-digit" }); }
    function cleanStatus(status){ if(!status) return "scheduled"; if(status === "pre") return "scheduled"; if(status === "post") return "final"; return status; }
    function hasScore(game){ return game.awayScore !== undefined && game.homeScore !== undefined && game.awayScore !== "" && game.homeScore !== ""; }
    function playIcon(){ return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="rgba(7,17,29,.18)"/><path d="M10 8.5v7l6-3.5-6-3.5Z" fill="currentColor"/></svg>`; }
    function slug(value){ return String(value).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
    function escapeHtml(value){ return String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c])); }
    function escapeJs(value){ return String(value ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

    updatePlatformUi();
    document.querySelector("#refreshBtn").addEventListener("click", fetchSchedule);
    fetchSchedule();
  </script>
</body>
</html>
